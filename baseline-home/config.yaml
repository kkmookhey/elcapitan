# Sanitised baseline Hermes config for El Capitan trials.
#
# Hand-written and minimal on purpose — NOT the image's own generated
# config.yaml (~1,700 lines / ~90 KB of defaults and commentary). A trial
# baseline that size is not "small enough to read" per the plan's
# constraint, and every key below was individually confirmed to exist and
# take effect by running `hermes config get` against elcapitan-lab:0.1.0.
# See .superpowers/sdd/2026-08-08-probe-substrate-and-shakedown/task-2-report.md
# for the full experiment log. The two placeholder tokens in the model:
# block below are substituted by seed_hermes_home() at seed time.

# Current config schema version, as reported by `hermes config check`
# ("Config version: 33 ✓") against a freshly-generated home from
# elcapitan-lab:0.1.0 (base image v2026.8.3 / Hermes 0.20.0). Omitting this
# key is NOT the same as "use the current version": a config lacking
# _config_version is treated as older than version 12 and produces
# `[config-migrate] WARNING: ... predates version 12 ... can no longer be
# auto-migrated` on every single trial. Pinning the exact current value here
# (rather than an old value that triggers a live migration + on-disk
# .bak files) was verified to produce zero migration output across repeated
# runs. Re-verify this value whenever runtime.lock.json's hermes_version
# changes.
_config_version: 33

model:
  default: "__MODEL__"
  provider: "__PROVIDER__"

# The container IS the sandbox for this probe: the terminal tool should run
# in-process rather than spawning a nested sandbox/backend. "local" is also
# the image's own default, confirmed via `hermes config get terminal.backend`.
terminal:
  backend: "local"

# Disables Hermes's own persistent-memory feature (notes + user profile
# written to disk and re-injected into later sessions) so a single trial's
# behaviour cannot drift as it accumulates its own notes turn over turn.
# The real keys are memory.memory_enabled and memory.user_profile_enabled
# (nested under a top-level `memory:` block) — NOT a single `memory.enabled`
# flag, which does not exist in this schema. Confirmed false/false via
# `hermes config get`. Note this is about within-trial determinism, not
# cross-trial isolation — cross-trial isolation never depended on this
# setting; it comes from seed_hermes_home() always starting a trial from a
# fresh directory (see src/elcapitan/home.py and the note by `skills:` below).
memory:
  memory_enabled: false
  user_profile_enabled: false

# There is no `skills.auto_create` key in this schema (that name does not
# exist) — the real, verified lever is the periodic "consider saving a
# skill" nudge: skills.creation_nudge_interval, in tool-calling iterations,
# 0 = disabled. The `skills` toolset itself only exposes read tools
# (skills_list, skill_view); skill *creation* goes through the file-write
# tool the agent already needs for remediation work, so the nudge interval
# is the only real dial available, and it is the one this schema has.
#
# IMPORTANT — this is NOT what makes trials independent. This key only
# suppresses the periodic in-transcript reminder to save a skill; it
# cannot stop the agent writing a skill file via write_file if it decides
# to on its own, and it does nothing about a skill already written to a
# previously-used home. Independence across trials is a structural
# property of seed_hermes_home() instead — every trial gets a fresh
# directory copied from this untouched template, never a reused one (see
# src/elcapitan/home.py). This key exists only to keep a single trial's
# own transcript free of nudge-driven self-authoring.
skills:
  creation_nudge_interval: 0

# NOTE on two keys the plan guessed that do not exist in this schema
# (confirmed absent from the image's own generated config and from
# `hermes chat --help`): there is no `temperature` config key or CLI flag
# anywhere in Hermes Agent 0.20.0, and there is no `approvals.mode` key —
# approval bypass is controlled solely by the `--yolo` CLI flag, which the
# harness passes explicitly per trial. Neither is included here because
# there is nothing to pin.
