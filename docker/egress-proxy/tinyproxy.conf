# The challenger's only route out. Everything not on the filter list is denied.
#
# The challenger is a model-backed agent, so it cannot run with no network at
# all — measured: --network=none gives three APIConnectionError retries, exit
# 0, and no verdict. What --network=none was really protecting is narrower
# than "no network": the challenger must not be able to fetch EVIDENCE. This
# config is that narrower property, written down.

Port 8888
Listen 0.0.0.0
Timeout 600

# Who may USE the proxy. The proxy is only reachable from the internal
# challenger network, which has no route out of its own, so this is a
# formality rather than the boundary — the boundary is the filter below.
Allow 0.0.0.0/0

# THE ALLOWLIST. FilterDefaultDeny inverts the usual sense: entries in the
# file are the only things permitted. Without it, tinyproxy treats the file as
# a blocklist and everything else is allowed — the failure would be silent and
# total, and the suite would stay green.
Filter "/etc/tinyproxy/filter"
FilterDefaultDeny Yes
FilterExtended On
# Match on the HOST, not the URL, because the filter file is written as a host
# pattern (^api\.anthropic\.com$) and an HTTPS request arrives as
# `CONNECT api.anthropic.com:443`.
#
# MEASURED, and not what was first assumed: flipping this to `On` does not
# leak — it over-blocks. api.anthropic.com becomes unreachable too, which
# would produce a challenger that never runs and a connection error
# indistinguishable from having no network at all. Both directions are held by
# tests: one proves example.com is denied, the other proves the model endpoint
# is not. Either alone would pass with this setting wrong.
FilterURLs Off

# CONNECT is how HTTPS tunnels. 443 only: no plaintext, no SSH, no anything
# else wearing a CONNECT.
ConnectPort 443

# No disk log. The proxy sees request metadata for a scored trial, and a log
# file inside the container is one more place a trial's shape is recorded
# where nothing is hashing it.
LogLevel Warning
