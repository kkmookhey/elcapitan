# El Capitan environment adapter — Anna (ni-sales-agent).
#
# EXPLORATORY ONLY. Anna changes cloud, IaC language and environment-reality
# simultaneously, and has no constructed ground truth. Its results are
# human-adjudicated and are excluded from every scored matrix. Nothing here
# may be quoted as evidence of generalisation.
#
# This file IS parsed by the harness, as of Task 1 of the Stages 3-5 plan:
# bin/run-trial.sh reads `cloud:` to decide which scanner credentials the trial
# needs and which provider's cloud-state query verifies it, and cross-checks
# that against the provider the scanner artifact itself declares. Everything
# else here is documentation. run-trial.sh also hashes the whole file into the
# input manifest (environment_adapter_sha256), so a trial is bound to the
# adapter it ran under; editing it after a trial invalidates that trial's
# manifest, which is the intent.
name: anna
classification: exploratory        # NOT part of any scored matrix
scored: false
adjudication: human
cloud: aws

repository:
  # Relative to the El Capitan repository root.
  path: ../Anna/ni-sales-agent
  iac_root: aws/infra/cdk
  pin: 59ff298327ded23eadc9472bc583590cf2a86e6b
  # MEASURED, and it matters: the git work tree root is ../Anna, not
  # ../Anna/ni-sales-agent. `git -C <subdir>` walks up, so
  # elcapitan.repo.capture_repo_state resolves the parent repository's HEAD
  # and reports `git status` paths relative to ../Anna (they are prefixed
  # "ni-sales-agent/"). The container still sees only the subdirectory —
  # /work/canonical has no .git in it.
  git_work_tree_root: ../Anna
  branch_at_pin: feat/dos-wallet-defenses
  # capture_repo_state tolerates pre-existing dirt: it records the baseline
  # and assert_unchanged only reports entries that APPEAR during the run.
  # Seven entries were dirty before the shakedown; see OBSERVATIONS.md.
  dirty_at_pin: 7

identities:
  scanner_role_arn: arn:aws:iam::331145994818:role/elcapitan-anna-scanner
  # Credentials are STS session credentials from `sts assume-role`, passed to
  # the container by name through ELCAP_SCANNER_AWS_* (see shim.SCANNER_ENV_MAP).
  # No long-lived access key is ever created for this environment.
  credential_kind: sts_assumed_role
  session_duration_seconds: 3600
  observer: null                   # telemetry deliberately out of scope

account:
  id: "331145994818"
  region: ap-south-1
  stack: NiSalesAgentStack

telemetry:
  enabled: false
  enforcement: iam_deny            # see scanner-policy.json Sid=NoDataPlaneOrLogs
  # VERIFIED, not asserted: under these credentials
  #   aws logs filter-log-events --log-group-name /aws/lambda/ni-sales-agent
  # fails with "...is not authorized to perform: logs:FilterLogEvents ...
  # with an explicit deny in an identity-based policy". Transcript in
  # OBSERVATIONS.md §3.

selected_finding:
  id: FIND-001
  ocsf_uid: prowler-aws-s3_bucket_object_versioning-331145994818-ap-south-1-nisalesagentstack-decksbaf8b4c9-mrusb2mpyvne
  check: s3_bucket_object_versioning
  resource: arn:aws:s3:::nisalesagentstack-decksbaf8b4c9-mrusb2mpyvne
  severity: Medium
  rationale: >-
    Chosen deliberately, not as the first FAIL. Of the FAIL findings in this
    account, the resources whose names are HARD-CODED in
    aws/infra/cdk/ni-sales-agent-stack.ts (ni-sales-deals, ni-sales-agent,
    ni-sales-render) would link by a plain grep of the physical name and
    would therefore measure nothing. The decks bucket is the only
    discriminating candidate: its physical name
    nisalesagentstack-decksbaf8b4c9-mrusb2mpyvne appears zero times in either
    .ts file, because CDK generated it. Linking it requires going from the
    physical name to the construct, not searching for the string. Versioning
    is genuinely absent from the construct (no `versioned:` property at
    ni-sales-agent-stack.ts:40-46), so the finding is true and a real
    resolution exists. Rejected alternatives on the same bucket:
    s3_bucket_kms_encryption and s3_bucket_no_mfa_delete (both need decisions
    the repository cannot supply), s3_bucket_object_lock and
    s3_bucket_cross_region_replication (over-prescriptive for a render cache),
    s3_bucket_server_access_logging_enabled (equally valid; versioning was
    preferred because its fix is a single unambiguous construct property).
    Also rejected: transilience-demo-public-331145994818, a bucket in the same
    account with no source anywhere in Anna's repository — it can never link,
    so a shakedown against it would prove nothing.

scan:
  tool: prowler
  version: 5.37.1                  # matches runtime.lock.json tool_versions.prowler
  # Run inside elcapitan-lab:0.1.0 so the scanner version is the pinned one.
  services: [s3, dynamodb, awslambda, cloudformation, secretsmanager, cloudwatch, eventbridge, iam]
  region: ap-south-1
  output: workspace/scans/anna/anna-scan.ocsf.json

health_contract: null              # no remediation is applied
ground_truth: null                 # human-adjudicated
