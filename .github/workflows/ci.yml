name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the complete source tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.14"
      - name: Install the runtime Terraform version
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.0"
          terraform_wrapper: false
      - name: Install locked Python 3.12 environment
        run: uv sync --locked --dev
      - name: Check release-tree invariants
        run: uv run python scripts/check_release_tree.py
      - name: Verify generated capability and evidence matrix
        run: uv run python scripts/generate_capability_matrix.py --check
      - name: Verify hash-locked runtime dependency export
        run: |
          uv export --locked --no-dev --no-emit-project --no-header --format requirements-txt --output-file /tmp/requirements-runtime.txt
          diff -u requirements-runtime.txt /tmp/requirements-runtime.txt
      - name: Check syntax and high-confidence static errors
        run: |
          uv run python -m compileall -q src tests scripts
          uvx --from ruff==0.16.0 ruff check --select E9,F63,F7,F82 src tests scripts
      - name: Run the full test suite
        run: uv run pytest -q
      - name: Build wheel and source distribution
        run: uv build --out-dir dist-ci
      - name: Inspect built distributions
        run: uv run python scripts/check_distributions.py dist-ci

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
      - name: Reject newly introduced vulnerable dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          fetch-depth: 0
      - name: Scan the complete Git history
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.30.1"

  container-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
      - name: Build the non-root runtime image
        run: docker build --tag elcapitan:ci .
      - name: Reject high and critical image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: elcapitan:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

  quickstart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
      - name: Run the PostgreSQL synthetic acceptance journey
        run: ./scripts/accept_quickstart.sh
