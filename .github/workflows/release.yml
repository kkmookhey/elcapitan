name: Release approved v0.1 artifacts

on:
  workflow_dispatch:
    inputs:
      legal_approval:
        description: Type RELEASE APPROVED after license and name approval are recorded
        required: true
        type: string
      approval_record_sha256:
        description: SHA-256 of the committed RELEASE_APPROVAL.json reviewed by the operator
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  publish:
    if: github.ref_type == 'tag' && inputs.legal_approval == 'RELEASE APPROVED'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/elcapitan
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.14"
      - name: Install the runtime Terraform version
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.1"
          terraform_wrapper: false
      - name: Enforce the final release gate
        env:
          APPROVAL_RECORD_SHA256: ${{ inputs.approval_record_sha256 }}
        run: >-
          uv run python scripts/check_release_tree.py --release
          --tag "${GITHUB_REF_NAME}"
          --approval-sha256 "${APPROVAL_RECORD_SHA256}"
      - name: Test and build distributions
        run: |
          uv sync --locked --dev
          uv run pytest -q
          uv build --out-dir dist
          uv run python scripts/check_distributions.py dist
          cd dist
          sha256sum * > SHA256SUMS
      - name: Generate CycloneDX distribution SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: dist
          format: cyclonedx
          output: dist/elcapitan-${{ github.ref_name }}.cdx.json
      - name: Build the final runtime image for vulnerability review
        run: docker build --tag elcapitan:release-scan .
      - name: Reject high and critical runtime vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: elcapitan:release-scan
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
      - name: Attest and sign distribution provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.0.0
        with:
          subject-path: dist/*
      - name: Attest and sign the distribution SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.0.0
        with:
          subject-path: dist/elcapitan-0.1.0-py3-none-any.whl
          sbom-path: dist/elcapitan-${{ github.ref_name }}.cdx.json
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.0.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.0.0
      - name: Build and publish versioned multi-architecture image
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.0.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
      - name: Attest and sign image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.0.0
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: Preserve release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: elcapitan-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error
