name: Release approved v0.1 artifacts

on:
  workflow_dispatch:
    inputs:
      legal_approval:
        description: Type RELEASE APPROVED after license and name approval are recorded
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  publish:
    if: github.ref_type == 'tag' && inputs.legal_approval == 'RELEASE APPROVED'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/elcapitan
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.14"
      - name: Enforce the final release gate
        run: uv run python scripts/check_release_tree.py --release --tag "${GITHUB_REF_NAME}"
      - name: Test and build distributions
        run: |
          uv sync --locked --dev
          uv run pytest -q
          uv build --out-dir dist
          uv run python scripts/check_distributions.py dist
          cd dist
          sha256sum * > SHA256SUMS
      - name: Generate CycloneDX distribution SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: dist
          format: cyclonedx
          output: dist/elcapitan-${{ github.ref_name }}.cdx.json
      - name: Attest and sign distribution provenance
        uses: actions/attest@v4
        with:
          subject-path: dist/*
      - name: Attest and sign the distribution SBOM
        uses: actions/attest@v4
        with:
          subject-path: dist/elcapitan-0.1.0-py3-none-any.whl
          sbom-path: dist/elcapitan-${{ github.ref_name }}.cdx.json
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and publish versioned multi-architecture image
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
      - name: Attest and sign image provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: Preserve release bundle
        uses: actions/upload-artifact@v7
        with:
          name: elcapitan-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error
