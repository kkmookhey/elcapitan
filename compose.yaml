name: elcapitan-quickstart

services:
  postgres:
    image: postgres:16.10-bookworm@sha256:38471f330eb885e04de130b768d6db4e10469e2311879c7e5c699f6d2d8a1c74
    environment:
      POSTGRES_DB: elcapitan
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_USER: elcapitan
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elcapitan -d elcapitan"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data

  shadow:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - elcapitan
      - serve-shadow
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --workdir
      - /data
    environment:
      ELCAPITAN_DATABASE_URL: postgresql://elcapitan@postgres:5432/elcapitan?sslmode=disable
      ELCAPITAN_SHADOW_ACCESS_TOKEN: ${ELCAPITAN_QUICKSTART_ACCESS_TOKEN:-local-preview-not-a-secret-00000000}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8770:8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    volumes:
      - shadow-data:/data

volumes:
  postgres-data:
  shadow-data:
