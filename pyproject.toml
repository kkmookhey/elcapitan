[project]
name = "elcapitan"
version = "0.1.0"
description = "Evidence-bound cloud remediation control plane"
readme = "README.md"
requires-python = "==3.12.*"
keywords = ["cloud-security", "evidence", "remediation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "jsonschema==4.23.0",
    "referencing==0.35.1",
    "PyYAML==6.0.2",
    "psycopg[binary]==3.3.4",
]

[project.scripts]
elcapitan = "elcapitan.cli:main"

[project.urls]
Documentation = "https://github.com/kkmookhey/elcapitan#readme"
Issues = "https://github.com/kkmookhey/elcapitan/issues"
Repository = "https://github.com/kkmookhey/elcapitan"

[dependency-groups]
dev = ["pytest==8.3.3"]

[build-system]
requires = ["setuptools==75.1.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
elcapitan = [
  "schemas/*.json",
  "web/*.html", "web/*.css", "web/*.js",
  "shadow_web_assets/*.html", "shadow_web_assets/*.css", "shadow_web_assets/*.js",
  "review_web_assets/*.html", "review_web_assets/*.css", "review_web_assets/*.js",
]

[tool.pytest.ini_options]
# Without this, `pytest` imports whatever `elcapitan` the ambient venv happens
# to have installed, so a green run proves nothing about *this* checkout —
# every "N passing" claim would be conditional on venv state nobody recorded.
# pythonpath entries are prepended to sys.path, so src/ wins over any install.
pythonpath = ["src", "."]
testpaths = ["tests"]
