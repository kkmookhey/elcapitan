[project]
name = "elcapitan"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = ["jsonschema==4.23.0", "referencing==0.35.1", "PyYAML==6.0.2"]

[dependency-groups]
dev = ["pytest==8.3.3"]

[build-system]
requires = ["setuptools==75.1.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
