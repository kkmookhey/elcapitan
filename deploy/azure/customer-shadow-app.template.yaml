# Render only in memory. Never commit values for either placeholder secret.
location: Central India
name: __APP_NAME__
resourceGroup: elcapitan-remediation-lab-rg
type: Microsoft.App/containerApps
tags:
  workload: elcapitan
  environment: customer-shadow
  data-classification: customer-metadata
identity:
  type: UserAssigned
  userAssignedIdentities:
    /subscriptions/8cd2b4cc-c789-466d-a8f7-8f51fb20985d/resourceGroups/elcapitan-remediation-lab-rg/providers/Microsoft.ManagedIdentity/userAssignedIdentities/elcapitan-demo-pull: {}
    __SCANNER_ID__: {}
properties:
  managedEnvironmentId: /subscriptions/8cd2b4cc-c789-466d-a8f7-8f51fb20985d/resourceGroups/elcapitan-remediation-lab-rg/providers/Microsoft.App/managedEnvironments/elcapitan-shadow-private-env
  configuration:
    activeRevisionsMode: Single
    ingress:
      allowInsecure: false
      external: false
      targetPort: 8080
      transport: Auto
      traffic:
        - latestRevision: true
          weight: 100
    registries:
      - server: ca7b25e7d425acr.azurecr.io
        identity: /subscriptions/8cd2b4cc-c789-466d-a8f7-8f51fb20985d/resourceGroups/elcapitan-remediation-lab-rg/providers/Microsoft.ManagedIdentity/userAssignedIdentities/elcapitan-demo-pull
    secrets:
      - name: database-url
        value: "__DATABASE_URL__"
      - name: shadow-access-token
        value: "__ACCESS_TOKEN__"
  template:
    containers:
      - name: shadow-control-plane
        image: __IMAGE__
        command:
          - elcapitan
        args:
          - serve-shadow
          - --host
          - 0.0.0.0
          - --port
          - "8080"
          - --workdir
          - /data/shadow
        env:
          - name: ELCAPITAN_SHADOW_ACCESS_TOKEN
            secretRef: shadow-access-token
          - name: ELCAPITAN_DATABASE_URL
            secretRef: database-url
          - name: ELCAP_SCANNER_AZURE_MANAGED_IDENTITY_CLIENT_ID
            value: __SCANNER_CLIENT_ID__
        resources:
          cpu: 0.5
          memory: 1Gi
    scale:
      minReplicas: 1
      maxReplicas: 1
